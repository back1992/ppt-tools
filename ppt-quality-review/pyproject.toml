[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-quality-review"
version = "1.0.1"
description = "Quality-review stack for generated slide decks: 4D/5D heuristics, pluggable static gate, render-level VLM visual QC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "back1992"}
]
keywords = ["ppt", "quality", "review", "vlm", "visual-qc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ppt-common>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/back1992/ppt-tools"
Repository = "https://github.com/back1992/ppt-tools"
Issues = "https://github.com/back1992/ppt-tools/issues"

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
]
visual = [
    "playwright>=1.40",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["ppt_quality_review*"]
