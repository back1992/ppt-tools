name: Publish to PyPI (trusted publishing, OIDC)

on:
  push:
    tags:
      - "ppt-common-v*"
      - "ppt-quality-review-v*"

jobs:
  publish-ppt-common:
    if: startsWith(github.ref_name, 'ppt-common-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ppt-common-v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('ppt-common/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION != pyproject version $PKG_VERSION — refusing to publish."
            exit 1
          fi
      - name: Install test deps and run package tests
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio pymupdf openai httpx
          python -m pytest ppt-common/tests -q
      - name: Build
        run: |
          python -m pip install build
          python -m build ppt-common --outdir ppt-common/dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ppt-common/dist/

  publish-ppt-quality-review:
    if: startsWith(github.ref_name, 'ppt-quality-review-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ppt-quality-review-v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('ppt-quality-review/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION != pyproject version $PKG_VERSION — refusing to publish."
            exit 1
          fi
      - name: Install test deps and run package tests
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio pymupdf
          python -m pip install "./ppt-common[llm]" "./ppt-quality-review[llm,visual,dev]"
          python -m pytest ppt-quality-review/tests -q
      - name: Build
        run: |
          python -m pip install build
          python -m build ppt-quality-review --outdir ppt-quality-review/dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ppt-quality-review/dist/
